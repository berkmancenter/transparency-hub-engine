name: Lint

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13.3"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: ruff-action
      # You may pin to the exact commit or the version.
      # uses: astral-sh/ruff-action@9828f49eb4cadf267b40eaa330295c412c68c1f9
      uses: astral-sh/ruff-action@v3.2.2
      with:
        # Pinned to the same version as .pre-commit-config.yaml, so CI checks
        # exactly what the local hook does. Unpinned, the action installs the
        # latest ruff, whose broader default rule set fails on unrelated code.
        version: "0.11.12"
      # with:
      #   # Arguments passed to Ruff. Use `ruff --help` to see available options. Defaults to `check`.
      #   args: # optional, default is check
      #   # Source to run Ruff. Defaults to the current directory.
      #   src: # optional, default is ${{ github.workspace }}
      #   # The version of Ruff to use, e.g., `0.6.0` Defaults to the version in pyproject.toml or 'latest'.
      #   version: # optional, default is 
      #   # Path to a pyproject.toml or requirements.txt file to read the version from.
      #   version-file: # optional
      #   # The checksum of the ruff version to install
      #   checksum: # optional
      #   # Used to increase the rate limit when retrieving versions and downloading ruff.
      #   github-token: # optional, default is ${{ github.token }}
    
